name: Sprint 6 Maven PostgreSQL y validacion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: senniaf_match
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d senniaf_match"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DB_URL: jdbc:postgresql://localhost:5432/senniaf_match
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SENNIAF_DEMO_PASSWORD: ${{ secrets.SENNIAF_DEMO_PASSWORD || 'Cambio123!' }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Pruebas unitarias e integración PostgreSQL
        run: mvn -B clean verify -Pe2e
      - name: Guardar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-sprint-6
          path: |
            target/surefire-reports/*
            target/failsafe-reports/*
          if-no-files-found: warn
