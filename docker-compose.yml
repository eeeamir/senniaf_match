services:
  postgres:
    image: postgres:16
    container_name: senniaf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: senniaf_match
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD para la base local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - senniaf_pgdata:/var/lib/postgresql/data

volumes:
  senniaf_pgdata:
