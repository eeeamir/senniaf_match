# Perfil exclusivo de la demostración remota, validado antes de iniciar el servidor.
server.address=127.0.0.1
server.port=8080
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
senniaf.auth.codigo-demo=false
senniaf.demo.habilitado=false
senniaf.seguridad.origen-publico=${SENNIAF_PUBLIC_ORIGIN}
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=127\\.0\\.0\\.1
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.threads.max=50
spring.datasource.hikari.maximum-pool-size=8
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

# No abrir registro hasta la recepción real y autorización. Credenciales solo en el servidor.
senniaf.auth.registro-publico=${SENNIAF_REGISTRO_PUBLICO:false}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
