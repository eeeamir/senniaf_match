server.port=8080
spring.application.name=senniaf-match

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/senniaf_match}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Opciones inseguras exclusivas de pruebas locales: desactivadas por defecto.
senniaf.auth.codigo-demo=${SENNIAF_CODIGO_DEMO:false}
senniaf.demo.habilitado=${SENNIAF_DEMO_HABILITADO:false}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.max-http-request-header-size=16KB
server.tomcat.max-part-count=20

# SMTP: deshabilitado hasta configurar el proveedor; nunca guarda claves en código.
senniaf.auth.registro-publico=${SENNIAF_REGISTRO_PUBLICO:false}
senniaf.correo.habilitado=${SMTP_ENABLED:false}
senniaf.correo.remitente=${SMTP_FROM:}
senniaf.correo.limite-diario=${SMTP_DAILY_LIMIT:200}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.debug.auth=false
