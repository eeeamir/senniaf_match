<!DOCTYPE html>
<html lang="es">
<head>
<link rel="preload" as="image" href="img/logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENNIAF Match · Motor de match</title>
<link rel="stylesheet" href="senniaf.css">
<link rel="stylesheet" href="match.css">
<link rel="stylesheet" href="calendly-theme.css">
<link rel="stylesheet" href="profesionales.css">
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <a class="topbar-marca" href="#"><img fetchpriority="high" decoding="sync" width="235" height="49" src="img/logo.png" alt="SENNIAF"><span></span></a>
  <div class="usuario" id="usuario"></div>
</div></header>
<section id="avisosPendientes" class="tarjeta avisos-globales" hidden aria-live="polite"></section>
<main id="contenido"></main>
<footer class="pie-pagina">© 2026 SENNIAF Match · Proyecto académico</footer>

<script src="senniaf.js"></script>
<script src="profesionales.js"></script>
<script src="comite.js"></script>
<script src="familia.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const sesion = Sesion.requerir(['FAMILIA', 'COMITE']);
if (sesion) {
  if(sesion.rol==='COMITE')vistaComite();
  else {vistaFamilia();setInterval(()=>{if(!document.hidden)vistaFamilia();},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)vistaFamilia();});}
}
let ultimaVersionVistaFamilia=null;

/* =====================================================================
   VISTA DE LA FAMILIA
   La familia ve en qué etapa va su proceso y cómo se decide. Nunca ve
   puntajes, ni perfiles de niños o niñas, ni a otras familias.
   ===================================================================== */
async function vistaFamilia() { await Familia.mostrar(sesion); }

/* =====================================================================
   VISTA DEL COMITÉ DE ASIGNACIÓN FAMILIAR
   El ranking y las decisiones provienen del backend con PostgreSQL.
   Cada factor llega como [puntos, razón] y el total es la suma.
   ===================================================================== */
async function vistaComite() { await Comite.iniciar(sesion); }
</script>
</body>
</html>
