<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENNIAF Match · Motor de match</title>
<link rel="stylesheet" href="senniaf.css">
<link rel="stylesheet" href="match.css">
<link rel="stylesheet" href="calendly-theme.css">
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <a class="topbar-marca" href="#"><img src="img/logo.png" alt="SENNIAF"><span></span></a>
  <div class="usuario" id="usuario"></div>
</div></header>
<main id="contenido"></main>
<footer class="pie-pagina">Uso institucional · Datos protegidos</footer>

<script src="senniaf.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const sesion = Sesion.requerir(['FAMILIA', 'COMITE']);
if (sesion) (sesion.rol === 'COMITE' ? vistaComite : vistaFamilia)();

/* =====================================================================
   VISTA DE LA FAMILIA
   La familia ve en qué etapa va su proceso y cómo se decide. Nunca ve
   puntajes, ni perfiles de niños o niñas, ni a otras familias.
   ===================================================================== */
async function vistaFamilia() {
  Sesion.pintarCabecera(sesion);

  let perfil = null;
  try {
    const r = await fetch('/api/familias/mi-perfil', { headers: Sesion.encabezados() });
    if (r.status === 404) return location.replace('perfil.html');
    if (r.status === 401) return Sesion.salir();
    if (r.ok) perfil = await r.json();
  } catch (_) { /* error de red */ }
  if (!perfil) {
    $('contenido').innerHTML = '<div class="mensaje error">No se pudo cargar tu entrevista. Comprueba la conexión e inicia sesión de nuevo.</div>';
    return;
  }

  const pasos = [
    ['Entrevista enviada', 'Recibimos la información de tu hogar.'],
    ['Perfil completo', 'Tu entrevista tiene lo necesario para ser considerada.'],
    ['Disponible para ser considerada', 'Cuando se registre un niño, niña o adolescente, tu familia entra en el análisis de compatibilidad.'],
    ['Revisión del Comité', 'El Comité de Asignación Familiar estudia las familias sugeridas y decide.'],
    ['Vinculación', 'Si el Comité te elige, tu equipo SENNIAF te acompaña en los siguientes pasos.']
  ];
  const actual = perfil.reevaluacionPendiente ? 1 : (perfil.perfilCompleto ? 2 : 1);
  const estado = (i) => (i < actual ? 'hecho' : i === actual ? 'actual' : 'pendiente');
  const rotulo = { hecho: 'Listo', actual: 'Estás aquí', pendiente: 'Más adelante' };

  $('contenido').innerHTML = `
    <section class="hero">
      <h1>Hola, ${esc(sesion.nombre.split(' ')[0])}</h1>
      <p>Gracias por compartir tu entrevista. Aquí puedes ver en qué etapa va tu proceso y cómo se toma la decisión.</p>
    </section>

    <section class="tarjeta">
      <h2>En qué etapa estás</h2>
      <ol class="etapas">${pasos.map(([t, d], i) => `
        <li class="${estado(i)}" ${i === actual ? 'aria-current="step"' : ''}>
          <span class="marca-etapa">${i < actual ? '✓' : i + 1}</span>
          <div><strong>${t}</strong> <span class="chip ${i < actual ? 'exito' : i === actual ? '' : 'neutro'}">${rotulo[estado(i)]}</span>
          <p>${d}</p></div>
        </li>`).join('')}
      </ol>
      ${perfil.reevaluacionPendiente ? `<div class="mensaje aviso">El Comité pidió que revises tu entrevista. El equipo técnico puede orientarte sobre los ajustes necesarios. <a class="boton chico" href="perfil.html?reevaluacion=1">Corregir entrevista</a></div>` : ''}
      ${perfil.perfilCompleto ? '' : `<div class="mensaje aviso">Tu entrevista quedó incompleta; todavía no participa en el análisis. <a href="perfil.html?reevaluacion=1">Completar información</a></div>`}
    </section>

    <section class="tarjeta">
      <h2>Cómo se decide</h2>
      <ul class="puntos">
        <li><strong>Primero, lo que el niño o la niña necesita.</strong> La compatibilidad se mide a partir de sus necesidades; tus preferencias se toman en cuenta, pero no deciden solas.</li>
        <li><strong>Siempre decide una persona.</strong> El sistema ordena sugerencias y el Comité las revisa con criterio humano. Quedar de primera en una lista no garantiza ni descarta nada.</li>
        <li><strong>Tu privacidad y la de los niños está protegida.</strong> No verás perfiles de niños, niñas ni de otras familias, y ellos tampoco verán el tuyo.</li>
      </ul>
    </section>

    <section class="tarjeta">
      <h2>Tu entrevista</h2>
      <p>Código de caso: <strong class="codigo">${esc(perfil.codigoCaso)}</strong>
         <span class="chip ${perfil.perfilCompleto ? 'exito' : 'aviso'}">${perfil.perfilCompleto ? 'Completa' : 'Incompleta'}</span></p>
      <p>Reevaluaciones completadas: <strong>${Number(perfil.numeroReevaluaciones || 0)}</strong>. Puedes <a href="perfil.html?reevaluacion=1">actualizar tu entrevista</a> cuando cambie tu situación.</p>
      ${perfil.requiereRevisionTecnica ? '<div class="mensaje aviso">Tu expediente requiere seguimiento del equipo técnico. No es una sanción ni implica pérdida automática de idoneidad.</div>' : ''}
    </section>

    <div class="mensaje aviso">El análisis es orientativo; SENNIAF y el Comité deben validar cada etapa conforme al procedimiento legal.</div>`;
}

/* =====================================================================
   VISTA DEL COMITÉ DE ASIGNACIÓN FAMILIAR
   El ranking y las decisiones provienen del backend con PostgreSQL.
   Cada factor llega como [puntos, razón] y el total es la suma.
   ===================================================================== */
const FACTORES = {
  edad:     { n: 'Rango de edad', max: 20, origen: 'Preferencia declarada' },
  hermanos: { n: 'Vínculos entre hermanos', max: 25, origen: 'Necesidad del niño o niña' },
  salud:    { n: 'Salud y desarrollo', max: 35, origen: 'Capacidad declarada y necesidades' },
  apoyo:    { n: 'Red de apoyo', max: 15, origen: 'Declaración de la familia' },
  logistica:{ n: 'Logística', max: 5, origen: 'Disponibilidad para visitas' }
};

async function vistaComite() {
  Sesion.pintarCabecera(sesion);
  $('contenido').className = 'ancho';
  let casos = [], pesos = null, casoActual = null, abierto = null;
  const Decisiones = { de(c) { return casos.find(x => x.codigo === c)?.historial || []; } };

  async function cargarCasos() {
    const [casosRespuesta, pesosRespuesta] = await Promise.all([
      fetch('/api/scoring/casos', { headers: Sesion.encabezados() }),
      fetch('/api/scoring/pesos', { headers: Sesion.encabezados() })
    ]);
    if (!casosRespuesta.ok || !pesosRespuesta.ok) throw new Error('No fue posible consultar el motor. Comprueba tu sesión y PostgreSQL.');
    casos = await casosRespuesta.json(); pesos = await pesosRespuesta.json();
    if (!casos.find(c => c.codigo === casoActual)) casoActual = casos[0]?.codigo || null;
  }

  const puntaje = (fam) => fam.puntaje;
  const nivel = (p) => (p >= 85 ? 'alta' : p >= 70 ? 'media' : 'baja');
  const decisionDe = (caso, fam) => Decisiones.de(caso).filter((d) => d.familia === fam).pop();
  const cerrado = (caso) => Decisiones.de(caso).some((d) => d.decision === 'ACEPTADA');

  function razones(fam) {
    const filas = Object.entries(fam.f).map(([k, [p, nota]]) => ({ k, p, nota, max: pesos[k], r: pesos[k] ? p / pesos[k] : 1 }));
    const orden = [...filas].sort((a, b) => b.r - a.r);
    return { filas, aFavor: orden.filter((x) => x.r >= .75).slice(0, 2), atencion: [...orden].reverse().filter((x) => x.r < .6).slice(0, 2) };
  }
  const item = (x) => `<li><strong>${FACTORES[x.k].n}</strong> <span class="pts">${x.p}/${x.max}</span><br>${esc(x.nota)}</li>`;

  function tarjetaFamilia(caso, fam, puesto) {
    const p = puntaje(fam), rz = razones(fam), dec = decisionDe(caso.codigo, fam.codigo), bloqueado = cerrado(caso.codigo);
    let pie;
    if (bloqueado) {
      pie = `<p class="ayuda">Este caso ya tiene una vinculación aceptada.</p>`;
    } else if (abierto && abierto.familia === fam.codigo) {
      const acepta = abierto.tipo === 'ACEPTADA';
      pie = `<form class="decision" data-familia="${fam.codigo}" data-tipo="${abierto.tipo}" novalidate>
          <label for="motivo">Fundamento de la decisión</label>
          <textarea id="motivo" required placeholder="Explica en qué necesidades del niño o niña se basa la decisión."></textarea>
          <p class="ayuda">La decisión queda auditada. Solicitar reevaluación permite corregir la entrevista familiar, sin imponer sanción automática.</p>
          <div class="mensaje error" id="errMotivo" role="alert"></div>
          <div class="fila-botones"><button class="boton chico" type="submit">Registrar decisión</button>
          <button class="boton secundario chico" type="button" data-accion="cancelar">Cancelar</button></div></form>`;
    } else {
      pie = `<div class="fila-botones"><button class="boton chico" type="button" data-accion="decidir" data-tipo="ACEPTADA" data-familia="${fam.codigo}">Aceptar propuesta</button>
        <button class="boton secundario chico" type="button" data-accion="decidir" data-tipo="DESCARTADA" data-familia="${fam.codigo}">Descartar</button>
        <button class="boton secundario chico" type="button" data-accion="decidir" data-tipo="REEVALUACION" data-familia="${fam.codigo}">Solicitar reevaluación</button></div>`;
    }
    return `<article class="familia ${dec ? dec.decision.toLowerCase() : ''}">
      <div class="familia-cab">
        <span class="puesto" aria-label="Puesto ${puesto}">${puesto}</span>
        <div><h3>${fam.codigo}</h3><span class="prov">${fam.provincia}</span></div>
        <div class="puntaje"><strong>${p}</strong><small>de 100 · compatibilidad ${nivel(p)}</small>
          <div class="medidor"><i style="width:${p}%"></i></div></div>
      </div>
      ${fam.alertaRevisionTecnica ? '<div class="mensaje aviso">Tres o más reevaluaciones: avisar al equipo técnico para seguimiento humano. Sin penalización automática.</div>' : ''}
      ${dec ? `<p class="ayuda">Última decisión: ${esc(dec.decision)} · ${esc(dec.fecha)}</p>` : ''}
      <div class="razones">
        <div><h4>A favor</h4><ul>${rz.aFavor.map(item).join('') || '<li>Sin factores destacados.</li>'}</ul></div>
        <div><h4>Para considerar</h4><ul>${rz.atencion.map(item).join('') || '<li>Sin puntos de atención.</li>'}</ul></div>
      </div>
      <details><summary>Ver el desglose completo</summary>
        <div class="tabla"><table><thead><tr><th>Factor</th><th>Se basa en</th><th>Puntos</th><th>Razón</th></tr></thead><tbody>
          ${rz.filas.map((x) => `<tr><td>${FACTORES[x.k].n}</td><td>${FACTORES[x.k].origen}</td>
            <td><span class="mini"><i style="width:${x.r * 100}%"></i></span> ${x.p}/${x.max}</td><td>${esc(x.nota)}</td></tr>`).join('')}
        </tbody></table></div></details>
      <div class="familia-pie">${pie}</div>
    </article>`;
  }

  function pintar() {
    const caso = casos.find((c) => c.codigo === casoActual);
    if (!caso) {
      $('contenido').innerHTML = `<section class="hero"><h1>Comité de Asignación Familiar</h1></section>
        <div class="mensaje aviso">No hay casos infantiles completos disponibles para el ranking. Registra un perfil y completa su información.</div>
        ${controlesPesos()}`;
      return;
    }
    const lista = [...caso.familias].sort((a, b) => puntaje(b) - puntaje(a));
    const hist = Decisiones.de(caso.codigo);
    $('contenido').innerHTML = `
      <section class="hero">
        <h1>Comité de Asignación Familiar</h1>
        <p>Familias ordenadas por compatibilidad para cada caso, con la razón de cada puntaje. La decisión parte de las necesidades del niño, niña o adolescente, no solo de lo que las familias prefieren.</p>
      </section>
      ${controlesPesos()}
      <div class="comite">
        <nav class="casos" aria-label="Casos para la sesión">${casos.map((c) => `
          <button type="button" class="caso" data-accion="caso" data-codigo="${c.codigo}" aria-pressed="${c.codigo === casoActual}">
            <strong>${c.codigo}</strong><span>${c.edad} años · ${c.escolar}</span>
            <span class="chip ${cerrado(c.codigo) ? 'exito' : 'aviso'}">${cerrado(c.codigo) ? 'Decidido' : 'Pendiente'}</span></button>`).join('')}
        </nav>
        <div>
          <section class="tarjeta caso-detalle" style="margin-top:0">
            <h2>${caso.codigo} · ${caso.edad} años · ${caso.escolar}</h2>
            <p>Necesidades que guían la decisión:</p>
            <ul class="necesidades">${caso.necesidades.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>
          </section>
          <h2 class="subtitulo">Familias sugeridas, de mayor a menor compatibilidad</h2>
          ${lista.length ? lista.map((f, i) => tarjetaFamilia(caso, f, i + 1)).join('') : '<div class="mensaje aviso">No hay familias completas y disponibles para este caso.</div>'}
          ${hist.length ? `<section class="tarjeta"><h2>Registro de decisiones</h2><ul class="historial">${hist.map((d) =>
            `<li><strong>${esc(d.familia)}</strong> · ${esc(d.decision)} · ${esc(d.por)} · ${esc(d.fecha)} · ${d.puntaje} puntos, pesos v${d.versionPesos}<br>${esc(d.motivo)}</li>`).join('')}</ul></section>` : ''}
        </div>
      </div>`;
    const m = $('motivo'); if (m) m.focus();
  }

  function controlesPesos() {
    return `<section class="tarjeta"><h2>Pesos del motor · versión ${pesos.version}</h2>
      <p class="ayuda">Configuración académica. El Comité debe revisar las recomendaciones y no asignar automáticamente.</p>
      <form id="formPesos" class="pesos-grid">${Object.entries(FACTORES).map(([k,v]) => `
        <label>${v.n}<input type="number" name="${k}" min="0" max="100" required value="${pesos[k]}"></label>`).join('')}
        <button class="boton chico" type="submit">Guardar pesos</button></form>
      <p class="ayuda" id="pesoEstado">Total: ${['edad','hermanos','salud','apoyo','logistica'].reduce((sum,k)=>sum+pesos[k],0)} puntos</p></section>`;
  }

  $('contenido').addEventListener('click', (e) => {
    const b = e.target.closest('[data-accion]'); if (!b) return;
    const a = b.dataset.accion;
    if (a === 'caso') { casoActual = b.dataset.codigo; abierto = null; }
    else if (a === 'decidir') abierto = { familia: b.dataset.familia, tipo: b.dataset.tipo };
    else if (a === 'cancelar') abierto = null;
    pintar();
  });

  $('contenido').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (e.target.id === 'formPesos') {
      const cambios = Object.fromEntries([...new FormData(e.target)].map(([k,v]) => [k, Number(v)]));
      const mensaje = $('pesoEstado');
      if (Object.values(cambios).reduce((a,b)=>a+b,0) !== 100) { mensaje.textContent = 'La suma debe ser exactamente 100.'; return; }
      try {
        const r = await fetch('/api/scoring/pesos', { method:'PUT', headers:Sesion.encabezados({'Content-Type':'application/json'}), body:JSON.stringify(cambios) });
        if (!r.ok) throw new Error((await r.json()).mensaje);
        await cargarCasos(); pintar();
      } catch(error) { mensaje.textContent = error.message; }
      return;
    }
    const f = e.target, motivo = $('motivo').value.trim();
    if (motivo.length < 10) { $('errMotivo').textContent = 'Escribe el fundamento de la decisión (mínimo 10 caracteres).'; return; }
    try {
      const r = await fetch(`/api/scoring/casos/${encodeURIComponent(casoActual)}/decisiones`, {
        method:'POST', headers:Sesion.encabezados({'Content-Type':'application/json'}),
        body:JSON.stringify({familia:f.dataset.familia, decision:f.dataset.tipo, motivo})
      });
      if (!r.ok) throw new Error((await r.json()).mensaje || 'No se guardó la decisión');
      abierto = null; await cargarCasos(); pintar();
    } catch(error) { $('errMotivo').textContent = error.message; }
  });

  try { await cargarCasos(); pintar(); }
  catch(error) { $('contenido').innerHTML = `<div class="mensaje error">${esc(error.message)}</div>`; }
}
</script>
</body>
</html>
