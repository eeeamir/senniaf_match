<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENNIAF Match · Motor de match</title>
<link rel="stylesheet" href="senniaf.css">
<link rel="stylesheet" href="match.css">
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <a class="topbar-marca" href="#"><img src="img/logo-senniaf.jpg" alt="SENNIAF"><span>SENNIAF Match</span></a>
  <div class="usuario" id="usuario"></div>
</div></header>
<main id="contenido"></main>
<footer class="pie-pagina">Uso institucional · Datos protegidos</footer>

<script src="senniaf.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const sesion = Sesion.requerir(['FAMILIA', 'COMITE']);
if (sesion) (sesion.rol === 'COMITE' ? vistaComite : vistaFamilia)();

/* =====================================================================
   VISTA DE LA FAMILIA
   La familia ve en qué etapa va su proceso y cómo se decide. Nunca ve
   puntajes, ni perfiles de niños o niñas, ni a otras familias.
   ===================================================================== */
async function vistaFamilia() {
  Sesion.pintarCabecera(sesion);

  let perfil = null;
  try {
    const r = await fetch('/api/familias/mi-perfil', { headers: { 'X-User-Role': 'FAMILIA', 'X-User-Id': sesion.id } });
    if (r.status === 404) return location.replace('perfil.html');
    if (r.ok) perfil = await r.json();
  } catch (_) { /* sin conexión */ }
  if (!perfil) {
    if (!localStorage.getItem('senniaf.entrevista.' + sesion.id)) return location.replace('perfil.html');
    perfil = { codigoCaso: '—', perfilCompleto: true };
  }

  const pasos = [
    ['Entrevista enviada', 'Recibimos la información de tu hogar.'],
    ['Perfil completo', 'Tu entrevista tiene lo necesario para ser considerada.'],
    ['Disponible para ser considerada', 'Cuando se registre un niño, niña o adolescente, tu familia entra en el análisis de compatibilidad.'],
    ['Revisión del Comité', 'El Comité de Asignación Familiar estudia las familias sugeridas y decide.'],
    ['Vinculación', 'Si el Comité te elige, tu equipo SENNIAF te acompaña en los siguientes pasos.']
  ];
  const actual = perfil.perfilCompleto ? 2 : 1;
  const estado = (i) => (i < actual ? 'hecho' : i === actual ? 'actual' : 'pendiente');
  const rotulo = { hecho: 'Listo', actual: 'Estás aquí', pendiente: 'Más adelante' };

  $('contenido').innerHTML = `
    <section class="hero">
      <h1>Hola, ${esc(sesion.nombre.split(' ')[0])}</h1>
      <p>Gracias por compartir tu entrevista. Aquí puedes ver en qué etapa va tu proceso y cómo se toma la decisión.</p>
    </section>

    <section class="tarjeta">
      <h2>En qué etapa estás</h2>
      <ol class="etapas">${pasos.map(([t, d], i) => `
        <li class="${estado(i)}" ${i === actual ? 'aria-current="step"' : ''}>
          <span class="marca-etapa">${i < actual ? '✓' : i + 1}</span>
          <div><strong>${t}</strong> <span class="chip ${i < actual ? 'exito' : i === actual ? '' : 'neutro'}">${rotulo[estado(i)]}</span>
          <p>${d}</p></div>
        </li>`).join('')}
      </ol>
      ${perfil.perfilCompleto ? '' : `<div class="mensaje aviso">Tu entrevista quedó incompleta, por eso todavía no entra al análisis de compatibilidad. Habla con tu trabajador social para completarla.</div>`}
    </section>

    <section class="tarjeta">
      <h2>Cómo se decide</h2>
      <ul class="puntos">
        <li><strong>Primero, lo que el niño o la niña necesita.</strong> La compatibilidad se mide a partir de sus necesidades; tus preferencias se toman en cuenta, pero no deciden solas.</li>
        <li><strong>Siempre decide una persona.</strong> El sistema ordena sugerencias y el Comité las revisa con criterio humano. Quedar de primera en una lista no garantiza ni descarta nada.</li>
        <li><strong>Tu privacidad y la de los niños está protegida.</strong> No verás perfiles de niños, niñas ni de otras familias, y ellos tampoco verán el tuyo.</li>
      </ul>
    </section>

    <section class="tarjeta">
      <h2>Tu entrevista</h2>
      <p>Código de caso: <strong class="codigo">${esc(perfil.codigoCaso)}</strong>
         <span class="chip ${perfil.perfilCompleto ? 'exito' : 'aviso'}">${perfil.perfilCompleto ? 'Completa' : 'Incompleta'}</span></p>
      <p>Si algo cambia en tu hogar, avísale a tu trabajador social para actualizar tus datos.</p>
    </section>

    <div class="mensaje aviso">Vista previa: el motor de match aún no está conectado. Las etapas posteriores se activarán cuando exista.</div>`;
}

/* =====================================================================
   VISTA DEL COMITÉ DE ASIGNACIÓN FAMILIAR
   DATOS DE EJEMPLO: no es el motor. `Motor.casos()` es el único punto
   que habrá que reemplazar. Endpoints sugeridos:
     GET  /api/match/casos                      → lista de casos con familias priorizadas
     POST /api/match/casos/{codigo}/decisiones  {familia, decision, motivo}
   Cada factor llega como [puntos, razón] y el total es la suma.
   ===================================================================== */
const FACTORES = {
  edad:     { n: 'Rango de edad',        max: 20, origen: 'Preferencia de la familia' },
  hermanos: { n: 'Vínculo con hermanos', max: 20, origen: 'Necesidad del niño o niña' },
  salud:    { n: 'Cuidados de salud',    max: 25, origen: 'Necesidad del niño o niña' },
  cercania: { n: 'Cercanía y servicios', max: 10, origen: 'Necesidad del niño o niña' },
  apoyo:    { n: 'Red de apoyo',         max: 15, origen: 'Necesidad del niño o niña' },
  cultura:  { n: 'Continuidad cultural', max: 10, origen: 'Necesidad del niño o niña' }
};

const Motor = {
  casos: () => [
    { codigo: 'NIN-001', edad: 7, escolar: 'Primaria',
      necesidades: ['Asma persistente: control médico cada mes', 'Tiene 1 hermano; se busca mantener el vínculo', 'Apoyo escolar en lectura'],
      familias: [
        { codigo: 'FAM-004', provincia: 'Panamá', f: { edad: [20, 'Acepta de 5 a 9 años'], hermanos: [20, 'Dispuesta a acoger a los dos hermanos'], salud: [22, 'Puede acompañar el asma; pediatra cercano'], cercania: [10, 'A 20 min del hospital de referencia'], apoyo: [13, 'Abuelos y tía viven en el hogar'], cultura: [6, 'Sin cercanía cultural declarada'] } },
        { codigo: 'FAM-002', provincia: 'Chiriquí', f: { edad: [20, 'Acepta de 4 a 8 años'], hermanos: [8, 'Prefiere un solo niño; abierta a conversar'], salud: [25, 'Enfermera en el hogar; conoce el asma'], cercania: [4, 'A 4 horas del control mensual'], apoyo: [15, 'Red amplia y estable'], cultura: [10, 'Comparte la comunidad de origen'] } },
        { codigo: 'FAM-007', provincia: 'Panamá Oeste', f: { edad: [14, 'Prefiere de 3 a 6 años; el niño tiene 7'], hermanos: [20, 'Acoge a los dos hermanos'], salud: [12, 'Puede acompañar solo con apoyo externo'], cercania: [10, 'Cerca de un centro de salud'], apoyo: [9, 'Pareja sin familia cercana'], cultura: [8, 'Interés en mantener su idioma'] } }
      ] },
    { codigo: 'NIN-002', edad: 12, escolar: 'Premedia',
      necesidades: ['Sin condiciones médicas relevantes', 'Necesita estabilidad escolar: conviene no cambiar de colegio', 'Tiene 1 hermana en su hogar de origen; contacto frecuente'],
      familias: [
        { codigo: 'FAM-005', provincia: 'Colón', f: { edad: [20, 'Acepta de 10 a 15 años'], hermanos: [16, 'Apoya contacto semanal con la hermana'], salud: [22, 'Sin requerimientos; seguro médico activo'], cercania: [8, 'Mismo corregimiento del colegio'], apoyo: [12, 'Madre sola con apoyo de hermanos'], cultura: [8, 'Mantiene tradiciones afines'] } },
        { codigo: 'FAM-001', provincia: 'Coclé', f: { edad: [12, 'Prefiere de 6 a 10 años; él tiene 12'], hermanos: [18, 'Abierta a visitas y vacaciones juntas'], salud: [24, 'Sin requerimientos especiales'], cercania: [5, 'Implicaría cambio de colegio'], apoyo: [14, 'Familia extensa cercana'], cultura: [9, 'Interés en su historia local'] } },
        { codigo: 'FAM-006', provincia: 'Panamá', f: { edad: [20, 'Acepta de 9 a 14 años'], hermanos: [10, 'Poco espacio para visitas frecuentes'], salud: [25, 'Sin requerimientos especiales'], cercania: [10, 'Puede mantener el mismo colegio'], apoyo: [7, 'Trabajo de tiempo completo, sin red'], cultura: [5, 'Sin cercanía cultural declarada'] } }
      ] }
  ]
};

const Decisiones = {
  clave: 'senniaf.decisiones',
  todas() { return JSON.parse(localStorage.getItem(this.clave) || '{}'); },
  de(caso) { return this.todas()[caso] || []; },
  registrar(caso, reg) { const d = this.todas(); (d[caso] = d[caso] || []).push(reg); localStorage.setItem(this.clave, JSON.stringify(d)); }
};

function vistaComite() {
  Sesion.pintarCabecera(sesion);
  $('contenido').className = 'ancho';
  const casos = Motor.casos();
  let casoActual = casos[0].codigo, abierto = null;   // abierto = { familia, tipo }

  const puntaje = (fam) => Object.values(fam.f).reduce((s, [p]) => s + p, 0);
  const nivel = (p) => (p >= 85 ? 'alta' : p >= 70 ? 'media' : 'baja');
  const decisionDe = (caso, fam) => Decisiones.de(caso).filter((d) => d.familia === fam).pop();
  const cerrado = (caso) => Decisiones.de(caso).some((d) => d.decision === 'ACEPTADA');

  function razones(fam) {
    const filas = Object.entries(fam.f).map(([k, [p, nota]]) => ({ k, p, nota, max: FACTORES[k].max, r: p / FACTORES[k].max }));
    const orden = [...filas].sort((a, b) => b.r - a.r);
    return { filas, aFavor: orden.filter((x) => x.r >= .75).slice(0, 2), atencion: [...orden].reverse().filter((x) => x.r < .6).slice(0, 2) };
  }
  const item = (x) => `<li><strong>${FACTORES[x.k].n}</strong> <span class="pts">${x.p}/${x.max}</span><br>${esc(x.nota)}</li>`;

  function tarjetaFamilia(caso, fam, puesto) {
    const p = puntaje(fam), rz = razones(fam), dec = decisionDe(caso.codigo, fam.codigo), bloqueado = cerrado(caso.codigo) && !dec;
    let pie;
    if (dec) {
      pie = `<p class="decidido"><span class="chip ${dec.decision === 'ACEPTADA' ? 'exito' : 'error'}">${dec.decision === 'ACEPTADA' ? 'Vinculación aceptada' : 'Rechazada'}</span> ${esc(dec.por)} · ${esc(dec.fecha)}<br>${esc(dec.motivo)}</p>`;
    } else if (bloqueado) {
      pie = `<p class="ayuda">Este caso ya tiene una vinculación aceptada.</p>`;
    } else if (abierto && abierto.familia === fam.codigo) {
      const acepta = abierto.tipo === 'ACEPTADA';
      pie = `<form class="decision" data-familia="${fam.codigo}" data-tipo="${abierto.tipo}" novalidate>
          <label for="motivo">Fundamento de la ${acepta ? 'aceptación' : 'decisión de rechazo'}</label>
          <textarea id="motivo" required placeholder="Explica en qué necesidades del niño o niña se basa la decisión."></textarea>
          <p class="ayuda">Queda registrado y ajusta los criterios del motor.</p>
          <div class="mensaje error" id="errMotivo" role="alert"></div>
          <div class="fila-botones"><button class="boton chico" type="submit">${acepta ? 'Registrar aceptación' : 'Registrar rechazo'}</button>
          <button class="boton secundario chico" type="button" data-accion="cancelar">Cancelar</button></div></form>`;
    } else {
      pie = `<div class="fila-botones"><button class="boton chico" type="button" data-accion="decidir" data-tipo="ACEPTADA" data-familia="${fam.codigo}">Aceptar vinculación</button>
        <button class="boton secundario chico" type="button" data-accion="decidir" data-tipo="RECHAZADA" data-familia="${fam.codigo}">Rechazar</button></div>`;
    }
    return `<article class="familia ${dec ? dec.decision.toLowerCase() : ''}">
      <div class="familia-cab">
        <span class="puesto" aria-label="Puesto ${puesto}">${puesto}</span>
        <div><h3>${fam.codigo}</h3><span class="prov">${fam.provincia}</span></div>
        <div class="puntaje"><strong>${p}</strong><small>de 100 · compatibilidad ${nivel(p)}</small>
          <div class="medidor"><i style="width:${p}%"></i></div></div>
      </div>
      <div class="razones">
        <div><h4>A favor</h4><ul>${rz.aFavor.map(item).join('') || '<li>Sin factores destacados.</li>'}</ul></div>
        <div><h4>Para considerar</h4><ul>${rz.atencion.map(item).join('') || '<li>Sin puntos de atención.</li>'}</ul></div>
      </div>
      <details><summary>Ver el desglose completo</summary>
        <div class="tabla"><table><thead><tr><th>Factor</th><th>Se basa en</th><th>Puntos</th><th>Razón</th></tr></thead><tbody>
          ${rz.filas.map((x) => `<tr><td>${FACTORES[x.k].n}</td><td>${FACTORES[x.k].origen}</td>
            <td><span class="mini"><i style="width:${x.r * 100}%"></i></span> ${x.p}/${x.max}</td><td>${esc(x.nota)}</td></tr>`).join('')}
        </tbody></table></div></details>
      <div class="familia-pie">${pie}</div>
    </article>`;
  }

  function pintar() {
    const caso = casos.find((c) => c.codigo === casoActual);
    const lista = [...caso.familias].sort((a, b) => puntaje(b) - puntaje(a));
    const hist = Decisiones.de(caso.codigo);
    $('contenido').innerHTML = `
      <section class="hero">
        <h1>Comité de Asignación Familiar</h1>
        <p>Familias ordenadas por compatibilidad para cada caso, con la razón de cada puntaje. La decisión parte de las necesidades del niño, niña o adolescente, no solo de lo que las familias prefieren.</p>
      </section>
      <div class="mensaje aviso">Vista previa con datos de ejemplo: el motor de match aún no está conectado.</div>
      <div class="comite">
        <nav class="casos" aria-label="Casos para la sesión">${casos.map((c) => `
          <button type="button" class="caso" data-accion="caso" data-codigo="${c.codigo}" aria-pressed="${c.codigo === casoActual}">
            <strong>${c.codigo}</strong><span>${c.edad} años · ${c.escolar}</span>
            <span class="chip ${cerrado(c.codigo) ? 'exito' : 'aviso'}">${cerrado(c.codigo) ? 'Decidido' : 'Pendiente'}</span></button>`).join('')}
        </nav>
        <div>
          <section class="tarjeta caso-detalle" style="margin-top:0">
            <h2>${caso.codigo} · ${caso.edad} años · ${caso.escolar}</h2>
            <p>Necesidades que guían la decisión:</p>
            <ul class="necesidades">${caso.necesidades.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>
          </section>
          <h2 class="subtitulo">Familias sugeridas, de mayor a menor compatibilidad</h2>
          ${lista.map((f, i) => tarjetaFamilia(caso, f, i + 1)).join('')}
          ${hist.length ? `<section class="tarjeta"><h2>Registro de decisiones</h2><ul class="historial">${hist.map((d) =>
            `<li><strong>${d.familia}</strong> · ${d.decision === 'ACEPTADA' ? 'Aceptada' : 'Rechazada'} · ${esc(d.por)} · ${esc(d.fecha)}<br>${esc(d.motivo)}</li>`).join('')}</ul></section>` : ''}
        </div>
      </div>`;
    const m = $('motivo'); if (m) m.focus();
  }

  $('contenido').addEventListener('click', (e) => {
    const b = e.target.closest('[data-accion]'); if (!b) return;
    const a = b.dataset.accion;
    if (a === 'caso') { casoActual = b.dataset.codigo; abierto = null; }
    else if (a === 'decidir') abierto = { familia: b.dataset.familia, tipo: b.dataset.tipo };
    else if (a === 'cancelar') abierto = null;
    pintar();
  });

  $('contenido').addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target, motivo = $('motivo').value.trim();
    if (motivo.length < 10) { $('errMotivo').textContent = 'Escribe el fundamento de la decisión (mínimo 10 caracteres).'; return; }
    Decisiones.registrar(casoActual, {
      familia: f.dataset.familia, decision: f.dataset.tipo, motivo, por: sesion.id,
      fecha: new Date().toLocaleString('es-PA', { dateStyle: 'medium', timeStyle: 'short' })
    });
    abierto = null; pintar();
  });

  pintar();
}
</script>
</body>
</html>
