<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENNIAF Match · Motor de match</title>
<link rel="stylesheet" href="match.css">
</head>
<body>
<header>
  <img src="img/logo-senniaf.jpg" alt="SENNIAF">
  <div class="usuario">
    <span id="nombre"></span><span class="rol" id="rol"></span>
    <button class="salir" id="btnSalir" type="button">Cerrar sesión</button>
  </div>
</header>

<main>
  <section class="hero">
    <h1>Motor de match</h1>
    <p id="intro"></p>
  </section>

  <section class="tarjeta" id="accion"></section>

  <section class="tarjeta vacio">
    <h2>Aquí aparecerá el match</h2>
    <p>La priorización de familias compatibles se implementará en el siguiente sprint.</p>
  </section>
</main>

<script>
  const sesion = JSON.parse(sessionStorage.getItem('senniaf.sesion') || 'null');
  if (!sesion) location.replace('index.html');

  const ROLES = { FAMILIA: 'Familia adoptante', TRABAJADOR_SOCIAL: 'Trabajador social', PSICOLOGO: 'Psicólogo' };
  document.getElementById('nombre').textContent = sesion.nombre;
  document.getElementById('rol').textContent = ROLES[sesion.rol];

  const esFamilia = sesion.tipo === 'FAMILIA';
  document.getElementById('intro').textContent = esFamilia
    ? 'Tu entrevista familiar es la base para encontrar una compatibilidad adecuada.'
    : 'Consulta las familias priorizadas para cada niño, niña o adolescente registrado.';

  document.getElementById('accion').innerHTML = esFamilia
    ? `<h2>Entrevista de idoneidad familiar</h2>
       <p>Puedes completar o actualizar los datos de tu hogar cuando lo necesites.</p>
       <a class="boton" href="perfil.html">Abrir mi formulario</a>`
    : `<h2>Perfil del niño, niña o adolescente</h2>
       <p>Registra un nuevo perfil integral para incluirlo en el proceso de compatibilidad.</p>
       <a class="boton" href="perfil.html">Registrar un perfil</a>`;

  document.getElementById('btnSalir').addEventListener('click', () => {
    sessionStorage.removeItem('senniaf.sesion');
    location.href = 'index.html';
  });
</script>
</body>
</html>
