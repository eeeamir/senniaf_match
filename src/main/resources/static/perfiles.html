<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENNIAF Match · Perfiles registrados</title>
<style>
:root{--azul:#005A9C;--azul2:#003B6F;--fondo:#EFF2EF;--borde:#D7DCD5;--texto:#263238;--suave:#5F6B72;--verde:#217346;--rojo:#9C4238}
*{box-sizing:border-box}body{margin:0;background:var(--fondo);color:var(--texto);font-family:"Segoe UI",Roboto,Arial,sans-serif}header{background:var(--azul2);color:#fff;padding:14px 28px;display:flex;justify-content:space-between;align-items:center}header img{width:145px;background:#fff;padding:5px;border-radius:8px}.usuario{display:flex;gap:16px;align-items:center}.salir{border:1px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:8px 15px;cursor:pointer}main{width:min(1000px,calc(100% - 32px));margin:38px auto}.encabezado{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:20px}.encabezado h1{margin:0;color:var(--azul2)}.encabezado p{margin:5px 0;color:var(--suave)}.volver{color:var(--azul);font-weight:600;text-decoration:none}.estado{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:30px;text-align:center;color:var(--suave)}.lista{display:grid;gap:14px}.perfil{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:12px}.perfil h2{margin:0 0 5px;color:var(--azul2);font-size:18px}.datos{display:flex;gap:18px;flex-wrap:wrap;color:var(--suave);font-size:13px}.estadoCaso{align-self:center;padding:7px 12px;border-radius:999px;background:#EAF6EE;color:var(--verde);font-size:12px;font-weight:600}.incompleto{background:#FFF6D6;color:#7A5B00}.alerta{color:var(--rojo);font-weight:600;font-size:12px;margin-top:7px}@media(max-width:650px){.encabezado{align-items:start;flex-direction:column}.perfil{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><img src="img/logo-senniaf.jpg" alt="SENNIAF"><div class="usuario"><span id="nombre"></span><button class="salir" id="btnSalir">Cerrar sesión</button></div></header>
<main>
 <div class="encabezado"><div><h1>Perfiles registrados</h1><p>Casos registrados por los funcionarios autorizados.</p></div><a class="volver" href="funcionario.html">← Volver al menú</a></div>
 <div id="estado" class="estado">Cargando perfiles…</div><div id="lista" class="lista"></div>
</main>
<script>
const sesion=JSON.parse(sessionStorage.getItem('senniaf.sesion')||'null');
if(!sesion||sesion.tipo!=='FUNCIONARIO') location.replace('index.html');
else {document.getElementById('nombre').textContent=sesion.nombre; cargar();}
document.getElementById('btnSalir').addEventListener('click',()=>{sessionStorage.removeItem('senniaf.sesion');location.href='index.html';});
async function cargar(){
 try{
  const r=await fetch('/api/ninos',{headers:{'X-User-Role':sesion.rol,'X-User-Id':sesion.id}}); const datos=await r.json();
  if(!r.ok) throw new Error(datos.mensaje||'No se pudieron consultar los perfiles.');
  const lista=document.getElementById('lista'), estado=document.getElementById('estado');
  if(!datos.length){estado.textContent='Todavía no hay perfiles registrados.';return;}
  estado.hidden=true;
  lista.innerHTML=datos.map(p=>`<article class="perfil"><div><h2>${p.codigoCaso}</h2><div class="datos"><span>Edad: ${p.edad??'—'}</span><span>Escolaridad: ${p.nivelEscolar??'—'}</span><span>Registrado por: ${p.registradoPor??'—'}</span></div>${p.alertaMedica?'<div class="alerta">⚠ Requiere revisión médica</div>':''}</div><span class="estadoCaso ${p.perfilCompleto?'':'incompleto'}">${p.perfilCompleto?'Completo':'Incompleto'}</span></article>`).join('');
 }catch(e){const estado=document.getElementById('estado');estado.textContent=e.message;estado.style.color='#9C4238';}
}
</script>
</body>
</html>
